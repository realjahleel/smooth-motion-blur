plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	// jar name: smooth-motion-blur-<gameversion>-<modversion>.jar
	archivesName = "smooth-motion-blur-${project.mc_label}"
}

repositories {
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases"
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	runs {
		clientGameTest {
			client()
			name = "Client Game Test"
			vmArg "-Dfabric.client.gametest"
			if (project.hasProperty("promoGif")) {
				vmArg "-Dmotionblur.promoGif"
			}
			runDir "build/clientgametest"
		}
	}

	mods {
		"motionblur" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// VulkanMod build for this Minecraft version (empty = none published yet).
def vulkanmodVersion = project.findProperty("vulkanmod_version") ?: ""
def vulkanmodTest = project.hasProperty("vulkanmod_test") && project.vulkanmod_test == "true" && !vulkanmodVersion.isEmpty()

dependencies {
	// Minecraft 26.x ships unobfuscated: no mappings, no remapping.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mod Menu (compile-only: the config screen entrypoint only loads when Mod Menu is installed)
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	// The gametest class ships with the jar; its entrypoint only activates
	// when the game runs with -Dfabric.client.gametest, never in normal play.

	from(file("../../LICENSE")) {
		rename { "${it}_$projectName"}
	}
}

// Production client gametest: runs the REAL built jars, so backend
// replacements like VulkanMod work exactly as they do for players.
// Usage: gradlew runProdClientGameTest [-Pvulkanmod_test=true]
configurations {
	productionMods {
		transitive = false
	}
}

dependencies {
	productionMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// the fabric-api bundle does not nest the gametest module and productionMods is non-transitive
	productionMods fabricApi.module("fabric-client-gametest-api-v1", project.fabric_api_version)
	if (vulkanmodTest) {
		productionMods "maven.modrinth:vulkanmod:${vulkanmodVersion}"
	}
}

tasks.register("runProdClientGameTest", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	dependsOn jar
	mods.from jar.archiveFile
	mods.from configurations.productionMods
	jvmArgs.add("-Dfabric.client.gametest")
	runDir = file("build/prodclientgametest")

	// skip the accessibility onboarding screen on the fresh run dir
	doFirst {
		def dir = file("build/prodclientgametest")
		dir.mkdirs()
		new File(dir, "options.txt").text = "onboardAccessibility:false\nnarrator:0\n"
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
